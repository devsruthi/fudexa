<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- soft plate / backdrop -->
  <circle cx="80" cy="80" r="72" fill="#FFE8E5"/>
  <circle cx="80" cy="80" r="58" fill="#FFF5F2"/>

  <!-- storefront -->
  <rect x="38" y="52" width="84" height="62" rx="10" fill="#E63946"/>
  <rect x="46" y="60" width="68" height="28" rx="6" fill="#FFF5F2"/>
  <rect x="66" y="92" width="28" height="22" rx="4" fill="#FF7A00"/>

  <!-- awning stripes -->
  <path d="M34 52h92v10H34z" fill="#FF7A00"/>
  <path d="M34 52h14v10H34zm28 0h14v10H62zm28 0h14v10H90zm28 0h14v10h-14z" fill="#E63946"/>

  <!-- CLOSED sign hanging -->
  <rect x="52" y="66" width="56" height="18" rx="4" fill="#E63946"/>
  <text x="80" y="79" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF5F2" letter-spacing="0.08em">CLOSED</text>

  <!-- small clock -->
  <circle cx="118" cy="118" r="16" fill="#FFF5F2" stroke="#E63946" stroke-width="3"/>
  <path d="M118 110v10l6 4" stroke="#E63946" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
